# A manual check that a fresh install, the type check, the build and the dev
# server work on Mac, Windows and Linux. It records install sizes and times.
# Run it from the Actions tab, or: gh workflow run check.yml
name: Install check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install, type check, build and smoke test
        run: node .github/scripts/install-check.mjs
        env:
          CHECK_LABEL: ${{ matrix.os }}-node${{ matrix.node }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: install-check-${{ matrix.os }}-node${{ matrix.node }}
          path: install-check.json
          if-no-files-found: ignore
