# Builds the app and publishes it to GitHub Pages on every push to main.
# Turn Pages on once (see AGENTS.md):
#   gh api -X POST repos/{owner}/{repo}/pages -f build_type=workflow
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages-on: ${{ steps.pages-on.outputs.on }}
    steps:
      # A new copy of the template runs this before Pages is turned on.
      # Skip quietly then, instead of failing.
      - id: pages-on
        name: Check that GitHub Pages is on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --silent; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages isn't on yet, so nothing was published. Turn it on once with: gh api -X POST repos/${GITHUB_REPOSITORY}/pages -f build_type=workflow"
          fi
      - if: steps.pages-on.outputs.on == 'true'
        uses: actions/checkout@v7
      - if: steps.pages-on.outputs.on == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.pages-on.outputs.on == 'true'
        id: pages
        uses: actions/configure-pages@v6
      - if: steps.pages-on.outputs.on == 'true'
        run: npm ci
      - if: steps.pages-on.outputs.on == 'true'
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - if: steps.pages-on.outputs.on == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.pages-on == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
